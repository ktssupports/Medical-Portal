{% extends 'base.html' %}{% from 'components.html' import heading,token,icon with context %}{% block content %}{{ heading('Register new patient','Create a new patient profile and unique medical ID.') }}<section class="card form-card"><div class="card-head"><div><h2>Patient information</h2><p>Enter the patient’s basic details.</p></div></div><form method="post" class="card-body">{{ token() }}<div class="form-grid"><label class="full">Full name<input name="name" required maxlength="150" placeholder="e.g. Olivia Rhye"></label><label>Age<input name="age" type="number" required min="1" max="129" placeholder="Age in years"></label><label>Gender<select name="gender"><option>Female</option><option>Male</option><option>Other</option><option>Prefer not to say</option></select></label><label class="full">Contact / phone<input type="tel" name="phone" placeholder="Enter contact number" required maxlength="50"></label></div><div class="form-actions"><a href="/patients" class="btn secondary">Cancel</a><button class="btn">{{ icon('users') }}Register patient</button></div></form></section>{% endblock %}
